name: GaliGuide CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-build:
    name: Test and Build Verification
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

    env:
      DATABASE_URL: "postgresql://testuser:testpassword@localhost:5432/testdb?schema=public"
      JWT_SECRET: "GaliGuideTestSecretKey2026!"
      NODE_ENV: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Setup PostgreSQL database & seed
        run: |
          npx prisma generate --schema=server/prisma/schema.prisma
          npx prisma db push --schema=server/prisma/schema.prisma --accept-data-loss
          npm run db:seed --workspace=server

      - name: Run unit & E2E tests
        run: npm test --workspace=server

      - name: Build server & client
        run: npm run build
