<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="cycGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#EAAA00" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#3A0F34" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="400" height="400" rx="24" fill="#F8F9FA" />
  <circle cx="200" cy="200" r="140" fill="url(#cycGlow)" />

  <!-- Spoked Bicycle Wheel on Stand -->
  <circle cx="180" cy="200" r="85" fill="none" stroke="#3A0F34" stroke-width="8" />
  <circle cx="180" cy="200" r="70" fill="none" stroke="#EAAA00" stroke-width="3" />
  <circle cx="180" cy="200" r="16" fill="#3A0F34" stroke="#EAAA00" stroke-width="3" />
  <!-- Wheel Spokes -->
  <line x1="180" y1="130" x2="180" y2="270" stroke="#CDD4DB" stroke-width="2" />
  <line x1="110" y1="200" x2="250" y2="200" stroke="#CDD4DB" stroke-width="2" />
  <line x1="130" y1="150" x2="230" y2="250" stroke="#CDD4DB" stroke-width="2" />
  <line x1="130" y1="250" x2="230" y2="150" stroke="#CDD4DB" stroke-width="2" />

  <!-- Foot Air Pump (Desi Cycle Pump) -->
  <rect x="290" y="140" width="18" height="130" rx="4" fill="#3A0F34" stroke="#EAAA00" stroke-width="2.5" />
  <!-- Pump Wooden T-Handle -->
  <line x1="270" y1="130" x2="328" y2="130" stroke="#EAAA00" stroke-width="8" stroke-linecap="round" />
  <line x1="299" y1="130" x2="299" y2="140" stroke="#CDD4DB" stroke-width="4" />
  <!-- Rubber Hose -->
  <path d="M290 260 Q260 270 250 240 Q240 220 220 230" stroke="#EAAA00" stroke-width="4" stroke-linecap="round" fill="none" />
</svg>
