<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="flowerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#EAAA00" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#3A0F34" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="400" height="400" rx="24" fill="#F8F9FA" />
  <circle cx="200" cy="200" r="140" fill="url(#flowerGlow)" />

  <!-- Cascading Fresh Marigold Garland (Genda Phool Mala) -->
  <g stroke="#3A0F34" stroke-width="2.5">
    <circle cx="200" cy="110" r="22" fill="#EAAA00" />
    <circle cx="165" cy="140" r="24" fill="#FFC83B" />
    <circle cx="235" cy="140" r="24" fill="#FFC83B" />
    <circle cx="140" cy="180" r="26" fill="#EAAA00" />
    <circle cx="260" cy="180" r="26" fill="#EAAA00" />
    <circle cx="160" cy="225" r="25" fill="#FFC83B" />
    <circle cx="240" cy="225" r="25" fill="#FFC83B" />
    <circle cx="200" cy="260" r="28" fill="#EAAA00" />
  </g>
  <!-- Garland Flower Centers -->
  <circle cx="200" cy="110" r="7" fill="#3A0F34" />
  <circle cx="165" cy="140" r="8" fill="#3A0F34" />
  <circle cx="235" cy="140" r="8" fill="#3A0F34" />
  <circle cx="140" cy="180" r="8" fill="#3A0F34" />
  <circle cx="260" cy="180" r="8" fill="#3A0F34" />
  <circle cx="160" cy="225" r="8" fill="#3A0F34" />
  <circle cx="240" cy="225" r="8" fill="#3A0F34" />
  <circle cx="200" cy="260" r="9" fill="#3A0F34" />

  <!-- Rose Petals Fluttering -->
  <path d="M280 120 Q295 105 310 125 Q295 140 280 120 Z" fill="#6C2D66" stroke="#3A0F34" stroke-width="2" />
  <path d="M100 240 Q115 225 130 245 Q115 260 100 240 Z" fill="#6C2D66" stroke="#3A0F34" stroke-width="2" />
</svg>
