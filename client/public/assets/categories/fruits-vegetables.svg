<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="vegGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#EAAA00" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#3A0F34" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="400" height="400" rx="24" fill="#F8F9FA" />
  <circle cx="200" cy="200" r="140" fill="url(#vegGlow)" />

  <!-- Traditional Woven Basket (Tokri) -->
  <path d="M120 200 L280 200 L255 280 L145 280 Z" fill="#EAAA00" stroke="#3A0F34" stroke-width="4" />
  <ellipse cx="200" cy="200" rx="80" ry="18" fill="#FFF6C5" stroke="#3A0F34" stroke-width="3.5" />
  <!-- Weave Texture -->
  <line x1="170" y1="210" x2="160" y2="280" stroke="#C78C00" stroke-width="2.5" />
  <line x1="200" y1="215" x2="200" y2="280" stroke="#C78C00" stroke-width="2.5" />
  <line x1="230" y1="210" x2="240" y2="280" stroke="#C78C00" stroke-width="2.5" />

  <!-- Produce in Basket: Papaya, Oranges, Bananas -->
  <circle cx="160" cy="180" r="26" fill="#3A0F34" stroke="#EAAA00" stroke-width="2.5" />
  <circle cx="220" cy="170" r="30" fill="#EAAA00" stroke="#3A0F34" stroke-width="3" />
  <circle cx="250" cy="190" r="22" fill="#6C2D66" stroke="#EAAA00" stroke-width="2" />

  <!-- Hanging Brass Balance Scale (Tarazu) on Side -->
  <line x1="280" y1="90" x2="340" y2="90" stroke="#3A0F34" stroke-width="3" />
  <line x1="310" y1="70" x2="310" y2="90" stroke="#3A0F34" stroke-width="3" />
  <path d="M280 90 L270 140 L290 140 Z" fill="#EAAA00" stroke="#3A0F34" stroke-width="1.5" />
  <path d="M340 90 L330 140 L350 140 Z" fill="#EAAA00" stroke="#3A0F34" stroke-width="1.5" />
</svg>
