<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="tailorGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#EAAA00" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#3A0F34" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="400" height="400" rx="24" fill="#F8F9FA" />
  <circle cx="200" cy="200" r="140" fill="url(#tailorGlow)" />

  <!-- Classic Foot-pedal Black/Gold Sewing Machine (Usha / Singer Style) -->
  <path d="M120 260 L280 260 L280 275 L120 275 Z" fill="#3A0F34" stroke="#EAAA00" stroke-width="3" />
  <!-- Arm & Head -->
  <path d="M250 260 L250 160 Q200 150 150 170 L150 210 L170 210 L170 180 Q210 170 230 180 L230 260" fill="#3A0F34" stroke="#EAAA00" stroke-width="3.5" />
  <!-- Needle & Presser Foot -->
  <line x1="160" y1="210" x2="160" y2="250" stroke="#CDD4DB" stroke-width="3" />
  <!-- Balance Hand Wheel -->
  <ellipse cx="260" cy="180" rx="10" ry="30" fill="#EAAA00" stroke="#3A0F34" stroke-width="2.5" />

  <!-- Measuring Tape Curled on Side -->
  <path d="M100 240 Q110 210 130 220 Q150 230 140 260" stroke="#EAAA00" stroke-width="4" stroke-linecap="round" fill="none" />
  <!-- Thread Spool -->
  <rect x="235" y="125" width="16" height="24" rx="3" fill="#EAAA00" stroke="#3A0F34" stroke-width="2" />
</svg>
