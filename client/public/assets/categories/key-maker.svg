<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="keyGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#EAAA00" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#3A0F34" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="400" height="400" rx="24" fill="#F8F9FA" />
  <circle cx="200" cy="200" r="140" fill="url(#keyGlow)" />

  <!-- Master Brass Key Blank -->
  <g transform="rotate(-35 200 200)">
    <!-- Bow / Head -->
    <circle cx="140" cy="200" r="42" fill="#EAAA00" stroke="#3A0F34" stroke-width="5" />
    <circle cx="140" cy="200" r="16" fill="#F8F9FA" stroke="#3A0F34" stroke-width="4" />
    <!-- Blade & Notches -->
    <rect x="180" y="190" width="120" height="20" rx="3" fill="#EAAA00" stroke="#3A0F34" stroke-width="4" />
    <!-- Key Bit Cuts -->
    <rect x="250" y="210" width="12" height="16" fill="#EAAA00" stroke="#3A0F34" stroke-width="3" />
    <rect x="272" y="210" width="10" height="12" fill="#EAAA00" stroke="#3A0F34" stroke-width="3" />
  </g>

  <!-- Key Cutting Rotary Disc Cutter on Right -->
  <circle cx="290" cy="130" r="34" fill="#DDE3E8" stroke="#3A0F34" stroke-width="4" />
  <circle cx="290" cy="130" r="10" fill="#3A0F34" />
  <line x1="290" y1="96" x2="290" y2="164" stroke="#3A0F34" stroke-width="2" />
  <line x1="256" y1="130" x2="324" y2="130" stroke="#3A0F34" stroke-width="2" />
  <!-- Sparkles -->
  <circle cx="245" cy="140" r="4" fill="#EAAA00" />
  <circle cx="255" cy="120" r="3" fill="#EAAA00" />
</svg>
