<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="sharpGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#EAAA00" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#3A0F34" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="400" height="400" rx="24" fill="#F8F9FA" />
  <circle cx="200" cy="200" r="140" fill="url(#sharpGlow)" />

  <!-- Foot-pedaled Grindstone Wheel -->
  <circle cx="190" cy="220" r="75" fill="#CDD4DB" stroke="#3A0F34" stroke-width="6" />
  <circle cx="190" cy="220" r="45" fill="#DDE3E8" stroke="#3A0F34" stroke-width="4" />
  <circle cx="190" cy="220" r="12" fill="#3A0F34" />

  <!-- Knife Blade Pressed to Stone -->
  <path d="M120 160 L240 215 L235 228 L110 175 Z" fill="#EAAA00" stroke="#3A0F34" stroke-width="3" />
  <!-- Knife Handle -->
  <rect x="70" y="145" width="55" height="18" rx="4" transform="rotate(25 97 154)" fill="#3A0F34" stroke="#EAAA00" stroke-width="2" />

  <!-- Dynamic Flying Orange Sparks -->
  <path d="M240 215 Q275 200 300 220" stroke="#EAAA00" stroke-width="3" stroke-linecap="round" fill="none" />
  <path d="M242 220 Q285 225 315 210" stroke="#EAAA00" stroke-width="2.5" stroke-linecap="round" fill="none" />
  <circle cx="285" cy="195" r="3.5" fill="#FFC83B" />
  <circle cx="310" cy="230" r="4" fill="#EAAA00" />
  <circle cx="325" cy="200" r="3" fill="#FFE04B" />
</svg>
