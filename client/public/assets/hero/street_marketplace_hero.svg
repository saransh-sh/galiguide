<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <!-- Sky & Warm Atmospheric Light -->
    <linearGradient id="warmSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF9" />
      <stop offset="40%" stop-color="#FFF5DE" />
      <stop offset="75%" stop-color="#FCE7BA" />
      <stop offset="100%" stop-color="#F6D59A" />
    </linearGradient>

    <!-- Morning Sun Glow -->
    <radialGradient id="morningSun" cx="25%" cy="30%" r="45%">
      <stop offset="0%" stop-color="#FFE885" stop-opacity="0.85" />
      <stop offset="40%" stop-color="#EAAA00" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#FFF5DE" stop-opacity="0" />
    </radialGradient>

    <!-- Ground & Cobblestone Cobblestones -->
    <linearGradient id="streetGround" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EDE6DD" />
      <stop offset="30%" stop-color="#E1D7CB" />
      <stop offset="100%" stop-color="#C5B7A8" />
    </linearGradient>

    <!-- Deep Aubergine Wood Texture -->
    <linearGradient id="woodAubergine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3A0F34" />
      <stop offset="50%" stop-color="#4E1746" />
      <stop offset="100%" stop-color="#3A0F34" />
    </linearGradient>

    <!-- Marigold Canvas Texture -->
    <linearGradient id="marigoldCanopy" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFE04B" />
      <stop offset="100%" stop-color="#EAAA00" />
    </linearGradient>

    <!-- Terracotta Clay Texture -->
    <linearGradient id="clayGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E06D44" />
      <stop offset="100%" stop-color="#A8431E" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#2D1128" flood-opacity="0.22" />
    </filter>
    <filter id="glowLight" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- 1. Background Sky -->
  <rect width="1200" height="800" fill="url(#warmSky)" />
  <circle cx="320" cy="220" r="280" fill="url(#morningSun)" />

  <!-- 2. Distant Alley Silhouette & Heritage Archway Arch -->
  <g fill="#E4D5C5" opacity="0.65">
    <path d="M0 480 L0 320 Q60 300 120 320 L120 480 Z" />
    <path d="M120 480 L120 280 Q180 240 240 280 L240 480 Z" />
    <path d="M240 480 L240 330 Q300 310 360 330 L360 480 Z" />
    <!-- Classic Jharokha Balcony in distance -->
    <rect x="150" y="300" width="60" height="50" rx="6" fill="#D3C1AE" />
    <path d="M140 295 Q180 270 220 295 Z" fill="#C5B19C" />
  </g>

  <!-- 3. Festive Bunting Flags across Street (Toran & Garlands) -->
  <g stroke="#EAAA00" stroke-width="1.5" fill="none">
    <path d="M0 140 Q300 240 600 160 Q900 250 1200 150" opacity="0.6" />
    <path d="M0 180 Q350 280 700 200 Q950 280 1200 190" opacity="0.4" />
  </g>
  <!-- Colorful Marigold & Sage Bunting Pennants -->
  <g>
    <polygon points="120,175 140,210 160,178" fill="#EAAA00" />
    <polygon points="180,183 200,218 220,187" fill="#3D6659" />
    <polygon points="240,192 260,227 280,196" fill="#3A0F34" />
    <polygon points="300,198 320,233 340,200" fill="#E06D44" />
    <polygon points="360,199 380,232 400,198" fill="#EAAA00" />
    <polygon points="420,195 440,226 460,191" fill="#3D6659" />
    <polygon points="480,188 500,220 520,183" fill="#3A0F34" />
    <polygon points="540,179 560,210 580,174" fill="#EAAA00" />
    <polygon points="660,173 680,205 700,178" fill="#3D6659" />
    <polygon points="730,185 750,219 770,190" fill="#E06D44" />
    <polygon points="800,198 820,234 840,203" fill="#3A0F34" />
    <polygon points="870,210 890,244 910,214" fill="#EAAA00" />
    <polygon points="940,217 960,250 980,219" fill="#3D6659" />
    <polygon points="1020,212 1040,242 1060,208" fill="#E06D44" />
  </g>

  <!-- 4. Sprawling Neem / Banyan Shady Tree on Left -->
  <g filter="url(#softShadow)">
    <path d="M-60 550 C-20 480, 20 420, 60 360 C80 320, 70 240, 40 180 C110 160, 180 180, 220 220 C260 260, 240 330, 210 370 C240 380, 270 410, 280 460 C290 510, 260 560, 210 580 Z"
          fill="#3D6659" opacity="0.9" />
    <path d="M-80 550 C-40 450, 40 380, 100 300 C140 240, 200 230, 240 270 C280 310, 260 370, 220 410 C240 450, 230 520, 180 570 Z"
          fill="#4D7F70" opacity="0.85" />
    <!-- Tree Trunk -->
    <path d="M20 580 Q45 460 35 380 Q55 450 70 580 Z" fill="#4A2518" />
  </g>

  <!-- 5. Street Ground with Cobblestone Perspective -->
  <path d="M0 500 L1200 480 L1200 800 L0 800 Z" fill="url(#streetGround)" />
  <!-- Paving Stones Lines -->
  <g stroke="#D4C8B8" stroke-width="2" opacity="0.7">
    <line x1="100" y1="520" x2="60" y2="800" />
    <line x1="300" y1="510" x2="250" y2="800" />
    <line x1="520" y1="500" x2="480" y2="800" />
    <line x1="720" y1="495" x2="710" y2="800" />
    <line x1="920" y1="490" x2="940" y2="800" />
    <line x1="1100" y1="485" x2="1140" y2="800" />
  </g>

  <!-- 6. Traditional Roadside Street Lamp Post on Right -->
  <g>
    <!-- Base & Pole -->
    <rect x="1080" y="320" width="14" height="260" rx="3" fill="#3A0F34" />
    <path d="M1065 580 L1109 580 L1097 560 L1077 560 Z" fill="#240720" />
    <!-- Curved Arm & Lantern -->
    <path d="M1087 340 C1087 290, 1040 280, 1020 310" fill="none" stroke="#3A0F34" stroke-width="6" stroke-linecap="round" />
    <!-- Glowing Lantern Lamp -->
    <polygon points="1010,310 1030,310 1035,340 1005,340" fill="#EAAA00" stroke="#3A0F34" stroke-width="3" filter="url(#glowLight)" />
    <polygon points="1013,315 1027,315 1031,336 1009,336" fill="#FFF6C5" />
    <circle cx="1020" cy="328" r="28" fill="#FFE04B" opacity="0.3" filter="url(#glowLight)" />
  </g>

  <!-- 7. Hero Feature: The Traditional Four-Wheeled Street Thela (Pushcart) -->
  <g transform="translate(420, 280)" filter="url(#softShadow)">
    <!-- Cart Cast Shadow -->
    <ellipse cx="250" cy="330" rx="280" ry="25" fill="#2D1128" opacity="0.25" />

    <!-- Stripy Marigold & Deep Aubergine Canopy Awnings -->
    <g>
      <!-- Roof Frame Poles -->
      <line x1="50" y1="120" x2="50" y2="220" stroke="#3A0F34" stroke-width="7" stroke-linecap="round" />
      <line x1="450" y1="120" x2="450" y2="220" stroke="#3A0F34" stroke-width="7" stroke-linecap="round" />
      <line x1="250" y1="90" x2="250" y2="220" stroke="#3A0F34" stroke-width="5" stroke-linecap="round" />

      <!-- Curved Canopy Canvas Top -->
      <path d="M20 120 Q250 50 480 120 L470 145 Q250 85 30 145 Z" fill="#EAAA00" />
      
      <!-- Alternating Scalloped Awning Stripes -->
      <path d="M20 140 Q60 140 60 170 Q20 170 20 140 Z" fill="#3A0F34" />
      <path d="M60 140 Q100 140 100 170 Q60 170 60 140 Z" fill="#EAAA00" />
      <path d="M100 140 Q140 140 140 170 Q100 170 100 140 Z" fill="#3A0F34" />
      <path d="M140 140 Q180 140 180 170 Q140 170 140 140 Z" fill="#EAAA00" />
      <path d="M180 140 Q220 140 220 170 Q180 170 180 140 Z" fill="#3A0F34" />
      <path d="M220 140 Q260 140 260 170 Q220 170 220 140 Z" fill="#EAAA00" />
      <path d="M260 140 Q300 140 300 170 Q260 170 260 140 Z" fill="#3A0F34" />
      <path d="M300 140 Q340 140 340 170 Q300 170 300 140 Z" fill="#EAAA00" />
      <path d="M340 140 Q380 140 380 170 Q340 170 340 140 Z" fill="#3A0F34" />
      <path d="M380 140 Q420 140 420 170 Q380 170 380 140 Z" fill="#EAAA00" />
      <path d="M420 140 Q460 140 460 170 Q420 170 420 140 Z" fill="#3A0F34" />
      <path d="M460 140 Q490 140 490 170 Q460 170 460 140 Z" fill="#EAAA00" />
    </g>

    <!-- Thela Wooden Table Platform -->
    <rect x="30" y="210" width="440" height="25" rx="4" fill="url(#woodAubergine)" stroke="#EAAA00" stroke-width="2" />
    <rect x="40" y="235" width="420" height="20" rx="2" fill="#240720" />

    <!-- Street Stalls Goodies: Tea Kettle, Kulhads, Jalebi & Snacks -->
    <g transform="translate(70, 140)">
      <!-- Steaming Brass Tea Kettle / Samovar -->
      <path d="M30 68 L55 68 L60 40 L25 40 Z" fill="#EAAA00" stroke="#3A0F34" stroke-width="2" />
      <ellipse cx="42" cy="40" rx="18" ry="6" fill="#FFE04B" />
      <path d="M20 52 C10 40, 10 65, 26 62" fill="none" stroke="#3A0F34" stroke-width="3" stroke-linecap="round" />
      <!-- Spout with Steam -->
      <path d="M60 48 Q75 42 72 35" fill="none" stroke="#3A0F34" stroke-width="3" stroke-linecap="round" />
      <path d="M74 30 Q80 15 75 0" fill="none" stroke="#EAAA00" stroke-width="2.5" stroke-linecap="round" opacity="0.8" />
      <path d="M80 32 Q88 18 84 5" fill="none" stroke="#FFE04B" stroke-width="2" stroke-linecap="round" opacity="0.6" />

      <!-- Terracotta Kulhads (Clay Cups) Stack -->
      <g transform="translate(85, 48)">
        <polygon points="0,22 14,22 12,8 2,8" fill="url(#clayGrad)" stroke="#3A0F34" stroke-width="1.5" />
        <polygon points="16,22 30,22 28,8 18,8" fill="url(#clayGrad)" stroke="#3A0F34" stroke-width="1.5" />
        <polygon points="32,22 46,22 44,8 34,8" fill="url(#clayGrad)" stroke="#3A0F34" stroke-width="1.5" />
      </g>

      <!-- Glass Display Case with Fresh Poha & Crispy Snacks -->
      <rect x="155" y="25" width="130" height="45" rx="4" fill="#FFFFFF" fill-opacity="0.75" stroke="#3A0F34" stroke-width="2" />
      <circle cx="185" cy="50" r="14" fill="#FFE04B" stroke="#EAAA00" stroke-width="2" />
      <circle cx="220" cy="48" r="16" fill="#E06D44" stroke="#A8431E" stroke-width="2" />
      <circle cx="255" cy="52" r="13" fill="#EAAA00" stroke="#3A0F34" stroke-width="1.5" />

      <!-- QR Code Standee on Counter (Digital UPI Ready) -->
      <g transform="translate(305, 30)">
        <rect x="0" y="0" width="22" height="36" rx="3" fill="#3A0F34" stroke="#EAAA00" stroke-width="1.5" />
        <rect x="3" y="4" width="16" height="18" fill="#FFFFFF" rx="1" />
        <rect x="5" y="6" width="4" height="4" fill="#3A0F34" />
        <rect x="13" y="6" width="4" height="4" fill="#3A0F34" />
        <rect x="5" y="14" width="4" height="4" fill="#3A0F34" />
        <rect x="11" y="14" width="2" height="2" fill="#EAAA00" />
      </g>
    </g>

    <!-- Handcart Wooden Spokes Wheels -->
    <!-- Left Wheel -->
    <g transform="translate(110, 275)">
      <circle cx="0" cy="0" r="48" fill="none" stroke="#3A0F34" stroke-width="9" />
      <circle cx="0" cy="0" r="44" fill="none" stroke="#EAAA00" stroke-width="2" />
      <circle cx="0" cy="0" r="14" fill="#3A0F34" stroke="#EAAA00" stroke-width="2.5" />
      <!-- 8 Spokes -->
      <line x1="0" y1="-44" x2="0" y2="44" stroke="#EAAA00" stroke-width="2.5" />
      <line x1="-44" y1="0" x2="44" y2="0" stroke="#EAAA00" stroke-width="2.5" />
      <line x1="-31" y1="-31" x2="31" y2="31" stroke="#EAAA00" stroke-width="2" />
      <line x1="31" y1="-31" x2="-31" y2="31" stroke="#EAAA00" stroke-width="2" />
    </g>

    <!-- Right Wheel -->
    <g transform="translate(390, 275)">
      <circle cx="0" cy="0" r="48" fill="none" stroke="#3A0F34" stroke-width="9" />
      <circle cx="0" cy="0" r="44" fill="none" stroke="#EAAA00" stroke-width="2" />
      <circle cx="0" cy="0" r="14" fill="#3A0F34" stroke="#EAAA00" stroke-width="2.5" />
      <line x1="0" y1="-44" x2="0" y2="44" stroke="#EAAA00" stroke-width="2.5" />
      <line x1="-44" y1="0" x2="44" y2="0" stroke="#EAAA00" stroke-width="2.5" />
      <line x1="-31" y1="-31" x2="31" y2="31" stroke="#EAAA00" stroke-width="2" />
      <line x1="31" y1="-31" x2="-31" y2="31" stroke="#EAAA00" stroke-width="2" />
    </g>

    <!-- Push Handle Bar -->
    <path d="M20 220 L-10 230 L-10 215 L20 205" fill="#3A0F34" stroke="#EAAA00" stroke-width="1.5" />
  </g>

  <!-- 8. Sidewalk Karigar Setup (Cobbler / Artisan Last under the Tree) on Left -->
  <g transform="translate(130, 520)" filter="url(#softShadow)">
    <ellipse cx="60" cy="90" rx="90" ry="18" fill="#2D1128" opacity="0.2" />
    
    <!-- Wooden Tool Chest (Sandookchi) -->
    <rect x="0" y="30" width="70" height="45" rx="4" fill="#3A0F34" stroke="#EAAA00" stroke-width="2" />
    <rect x="5" y="34" width="60" height="10" rx="2" fill="#EAAA00" opacity="0.8" />
    <!-- Brass Latch -->
    <circle cx="35" cy="52" r="4" fill="#FFE04B" stroke="#3A0F34" stroke-width="1.5" />

    <!-- Traditional Shoe Anvil (Kutta) Stand -->
    <path d="M85 75 L105 75 L110 30 L130 18 L125 5 L95 5 L80 30 Z" fill="#3A0F34" stroke="#EAAA00" stroke-width="2" />
    
    <!-- Polished Leather Shoe & Awl -->
    <path d="M125 5 Q145 0 160 15 L145 22 Z" fill="#E06D44" stroke="#3A0F34" stroke-width="1.5" />
    <line x1="60" y1="20" x2="80" y2="5" stroke="#EAAA00" stroke-width="3" stroke-linecap="round" />

    <!-- Woven Jute Mat (Phad / Tatpatti) -->
    <ellipse cx="60" cy="78" rx="80" ry="12" fill="#E6D3B3" stroke="#A88B68" stroke-width="1.5" stroke-dasharray="3 3" />
  </g>

  <!-- 9. Terracotta Matka Pots & Fresh Produce Baskets on Right Foreground -->
  <g transform="translate(940, 530)" filter="url(#softShadow)">
    <ellipse cx="60" cy="85" rx="80" ry="16" fill="#2D1128" opacity="0.2" />
    
    <!-- Traditional Clay Water Pot (Matka with Tap) -->
    <ellipse cx="30" cy="50" rx="28" ry="32" fill="url(#clayGrad)" stroke="#3A0F34" stroke-width="2.5" />
    <ellipse cx="30" cy="22" rx="14" ry="5" fill="#C2410C" stroke="#3A0F34" stroke-width="1.5" />
    <!-- Cloth Neck Cover & Red Thread -->
    <path d="M18 24 Q30 28 42 24" stroke="#FFE04B" stroke-width="2" fill="none" />

    <!-- Wicker Fruit Basket (Tokri) with Seasonal Produce -->
    <ellipse cx="85" cy="65" rx="35" ry="18" fill="#C59B63" stroke="#3A0F34" stroke-width="2" />
    <!-- Mangoes & Fresh Oranges in basket -->
    <circle cx="75" cy="55" r="9" fill="#EAAA00" stroke="#3A0F34" stroke-width="1.2" />
    <circle cx="90" cy="52" r="10" fill="#E06D44" stroke="#3A0F34" stroke-width="1.2" />
    <circle cx="102" cy="57" r="8" fill="#FFE04B" stroke="#3A0F34" stroke-width="1.2" />
  </g>

  <!-- 10. Floating Geodesic Street Navigation Waypoint Pin (The GaliGuide Marker) -->
  <g transform="translate(640, 210)" filter="url(#softShadow)">
    <!-- Pulsing Radar Halo -->
    <circle cx="0" cy="0" r="48" fill="none" stroke="#EAAA00" stroke-width="2" opacity="0.4" stroke-dasharray="4 6" />
    <circle cx="0" cy="0" r="36" fill="#FFE04B" opacity="0.25" filter="url(#glowLight)" />

    <!-- Vibrant Navigation Street Pin -->
    <path d="M-22 -14 C-22 -36, 22 -36, 22 -14 C22 4, 0 32, 0 36 C0 32, -22 4, -22 -14 Z"
          fill="url(#marigoldCanopy)" stroke="#3A0F34" stroke-width="3" />
    
    <!-- Pin Core Waypoint -->
    <circle cx="0" cy="-14" r="8" fill="#3A0F34" />
    <circle cx="0" cy="-14" r="3.5" fill="#FFFFFF" />

    <!-- Small "GaliGuide Waypoint" Tag -->
    <rect x="26" y="-24" width="96" height="22" rx="6" fill="#3A0F34" stroke="#EAAA00" stroke-width="1.5" />
    <text x="34" y="-9" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="10" fill="#FFE04B" letter-spacing="0.4">
      WAYPOINT #42
    </text>
  </g>
</svg>
