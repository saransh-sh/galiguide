<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 90" width="420" height="90">
  <defs>
    <linearGradient id="logoAub" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3A0F34" />
      <stop offset="100%" stop-color="#240720" />
    </linearGradient>
    <linearGradient id="logoGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE04B" />
      <stop offset="100%" stop-color="#EAAA00" />
    </linearGradient>
  </defs>

  <!-- Left Icon Mark -->
  <g transform="translate(10, 10)">
    <rect x="0" y="0" width="70" height="70" rx="18" fill="url(#logoAub)" stroke="#EAAA00" stroke-width="2.5" />
    <g transform="translate(35, 35)">
      <circle cx="0" cy="0" r="24" fill="none" stroke="#EAAA00" stroke-width="1" stroke-dasharray="2 3" opacity="0.4" />
      <path d="M-14 -7 C-14 -20, 14 -20, 14 -7 C14 3, 0 19, 0 21 C0 19, -14 3, -14 -7 Z"
            fill="url(#logoGold)" stroke="#3A0F34" stroke-width="1.8" />
      <circle cx="0" cy="-7" r="4.5" fill="#3A0F34" />
      <circle cx="0" cy="-7" r="2" fill="#FFFFFF" />
    </g>
  </g>

  <!-- Brand Typography -->
  <g transform="translate(95, 20)">
    <!-- Main Logotype: GaliGuide -->
    <text x="0" y="32" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="900" font-size="34" fill="#3A0F34" letter-spacing="-0.5">
      Gali<tspan fill="#EAAA00">Guide</tspan>
    </text>

    <!-- Version Badge -->
    <rect x="175" y="10" width="28" height="18" rx="5" fill="#FFF6C5" stroke="#EAAA00" stroke-width="1" />
    <text x="180" y="23" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="10" fill="#926200">V2</text>

    <!-- Subtitle -->
    <text x="2" y="52" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="11" fill="#6A5364" letter-spacing="0.3">
      Local Street Vendor Discovery • स्थानीय गली खोज
    </text>
  </g>
</svg>
